---
- name: Provision debian dev
  hosts: debian_dev
  gather_facts: true
  vars_prompt:
    - name: machine_ip
      prompt: "Machine IP address"
      private: false
    - name: ansible_become_password
      prompt: "Sudo password for {{ debian_dev_user | default('dev') }}"
      private: true
  tasks:
    # Bootstrap just added dev to the sudo group. The persistent SSH session
    # from the bootstrap play predates that change and lacks the group, so
    # reconnect to pick up fresh group membership before any sudo task.
    - name: Reset SSH connection so new sudo group membership takes effect
      ansible.builtin.meta: reset_connection

    - name: Install authorized SSH keys
      ansible.builtin.import_tasks: tasks/ssh_keys.yml
    - name: Harden the SSH daemon
      ansible.builtin.import_tasks: tasks/ssh_hardening.yml
    - name: Configure the firewall
      ansible.builtin.import_tasks: tasks/firewall.yml
    - name: Install apt packages
      ansible.builtin.import_tasks: tasks/apt_packages.yml
    - name: Configure unattended upgrades
      ansible.builtin.import_tasks: tasks/unattended_upgrades.yml
    - name: Install Tailscale
      ansible.builtin.import_tasks: tasks/tailscale.yml
    - name: Install the Go toolchain
      ansible.builtin.import_tasks: tasks/golang.yml
    - name: Install tools from GitHub releases
      ansible.builtin.import_tasks: tasks/github_tools.yml
    - name: Install the GitHub CLI
      ansible.builtin.import_tasks: tasks/github_cli.yml
    - name: Install Docker
      ansible.builtin.import_tasks: tasks/docker.yml
    - name: Install the PostgreSQL client
      ansible.builtin.import_tasks: tasks/postgresql.yml
    - name: Install and configure fish
      ansible.builtin.import_tasks: tasks/fish.yml
    - name: Install the Task runner
      ansible.builtin.import_tasks: tasks/task_runner.yml
    - name: Install Python tooling
      ansible.builtin.import_tasks: tasks/python_tools.yml
    - name: Install the Rust toolchain
      ansible.builtin.import_tasks: tasks/rust.yml
    - name: Install terminfo entries
      ansible.builtin.import_tasks: tasks/terminfo.yml
    - name: Create dev's SSH key
      ansible.builtin.import_tasks: tasks/dev_ssh_key.yml
    - name: Install Node and pnpm tooling
      ansible.builtin.import_tasks: tasks/node.yml
    - name: Apply dotfiles
      ansible.builtin.import_tasks: tasks/dotfiles.yml

  handlers:
    - name: SSH restart handler
      ansible.builtin.import_tasks: handlers/restart_ssh.yml
