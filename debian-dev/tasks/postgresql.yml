---
# Debian's postgresql-client lags well behind upstream, so install from the
# official PGDG apt repo instead.
- name: Ensure /etc/apt/keyrings exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download PostgreSQL apt keyring
  become: true
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"

- name: Add PostgreSQL apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    components: main
    signed_by: /etc/apt/keyrings/postgresql.asc
    state: present

- name: Install the PostgreSQL client
  become: true
  ansible.builtin.apt:
    name: postgresql-client-17
    state: present
    update_cache: true
