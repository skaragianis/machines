---
- name: Install/upgrade uv (astral.sh)  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -LsSf https://astral.sh/uv/install.sh | sh
    executable: /bin/bash
  changed_when: true

- name: Install/upgrade uv-managed tools to latest
  ansible.builtin.command:
    cmd: "/home/{{ debian_dev_user }}/.local/bin/uv tool install --force --reinstall {{ item }}@latest"
  loop:
    - ruff
    - ty
  changed_when: true
