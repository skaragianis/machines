---
- name: Install ufw
  become: true
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

# Allow SSH BEFORE the default-deny policy is enabled below, otherwise
# enabling ufw would drop the connection this play runs over and lock us out.
- name: Allow SSH through the firewall
  become: true
  community.general.ufw:
    rule: allow
    port: ssh
    proto: tcp

- name: Allow inbound traffic arriving over the tailnet
  become: true
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0

- name: Default-deny incoming traffic
  become: true
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default-allow outgoing traffic
  become: true
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable the firewall
  become: true
  community.general.ufw:
    state: enabled
