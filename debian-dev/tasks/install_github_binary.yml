---
# Included once per entry in github_release_tools (loop_var: tool). Resolves the
# latest release tag from the GitHub API, downloads that release's asset,
# extracts it under /opt/<name>/, and symlinks the binaries into
# /usr/local/bin. 
- name: "Resolve latest release tag for {{ tool.name }}"
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ tool.repo }}/releases/latest"
    headers:
      Accept: application/vnd.github+json
  register: gh_release
  when: tool.tag is not defined

- name: "Pin the release tag for {{ tool.name }}"
  ansible.builtin.set_fact:
    gh_tag: "{{ tool.tag if tool.tag is defined else gh_release.json.tag_name }}"

- name: "Read the recorded tag for {{ tool.name }}"
  ansible.builtin.slurp:
    src: "/opt/{{ tool.name }}/.installed-tag"
  register: gh_stamp
  failed_when: false
  when: tool.tag is not defined

- name: "Decide whether to download {{ tool.name }}"
  ansible.builtin.set_fact:
    gh_install: >-
      {{ tool.tag is defined
         or (gh_stamp.content | default('') | b64decode | trim) != gh_tag }}

- name: "Compute release facts for {{ tool.name }}"
  ansible.builtin.set_fact:
    gh_asset: >-
      {{ tool.asset
         | replace('{version}', gh_tag | regex_replace('^v', ''))
         | replace('{target}', tool.target[ansible_facts['architecture']]) }}
    gh_subdir: >-
      {{ tool.subdir
         | replace('{version}', gh_tag | regex_replace('^v', ''))
         | replace('{target}', tool.target[ansible_facts['architecture']]) }}
    gh_archive: "{{ tool.archive | default(true) | bool }}"

- name: "Create the extraction directory for {{ tool.name }}"
  become: true
  ansible.builtin.file:
    path: "/opt/{{ tool.name }}"
    state: directory
    mode: "0755"

# A bare-binary asset is its own artifact, so it lands executable (0755) and is
# never extracted; an archive stays 0644 and is unpacked in the next task.
- name: "Download the release asset for {{ tool.name }}"
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/{{ tool.repo }}/releases/download/{{ gh_tag }}/{{ gh_asset }}"
    dest: "/opt/{{ tool.name }}/{{ gh_asset }}"
    mode: "{{ '0644' if gh_archive else '0755' }}"
    force: true
  register: gh_download
  when: gh_install | bool

- name: "Extract the release asset for {{ tool.name }}"
  become: true
  ansible.builtin.unarchive:
    src: "/opt/{{ tool.name }}/{{ gh_asset }}"
    dest: "/opt/{{ tool.name }}"
    remote_src: true
  when: gh_download.changed and gh_archive

# Left ungated by gh_install: relinking is cheap next to a download, and running
# it every time repairs a symlink deleted by hand without forcing a reinstall.
# For an archive the symlink target is <subdir>/<bin> inside the extracted tree;
# for a bare binary the downloaded asset itself is the target, and `bins` just
# names the command it's exposed as (jq-linux-arm64 -> /usr/local/bin/jq).
- name: "Symlink binaries into /usr/local/bin for {{ tool.name }}"
  become: true
  ansible.builtin.file:
    src: "/opt/{{ tool.name }}/{{ (gh_subdir ~ '/') if gh_subdir else '' }}{{ item if gh_archive else gh_asset }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop: "{{ tool.bins }}"

# Some tools are invoked under a second name that the archive doesn't contain
# because upstream's own installer symlinks it (bunx -> bun). Point those at the
# first binary in `bins`.
- name: "Symlink command aliases into /usr/local/bin for {{ tool.name }}"
  become: true
  ansible.builtin.file:
    src: "/usr/local/bin/{{ tool.bins[0] }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop: "{{ tool.aliases | default([]) }}"

# Last on purpose — see the header note. Rolling-tag tools are excluded because
# their tag string is not a version and would pin them forever.
- name: "Record the installed tag for {{ tool.name }}"
  become: true
  ansible.builtin.copy:
    content: "{{ gh_tag }}\n"
    dest: "/opt/{{ tool.name }}/.installed-tag"
    mode: "0644"
  when:
    - tool.tag is not defined
    - gh_install | bool
