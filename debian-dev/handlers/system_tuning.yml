---
# Start, not restart: restarting swaps zram0 off, forcing everything in it back
# into RAM or onto disk. A config change to a running device waits for reboot.
- name: Start zram
  become: true
  ansible.builtin.systemd_service:
    name: systemd-zram-setup@zram0.service
    state: started
    daemon_reload: true

- name: Reload udev rules
  become: true
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: true

- name: Trigger block udev events
  become: true
  ansible.builtin.command:
    cmd: udevadm trigger --action=change --subsystem-match=block
  changed_when: true
