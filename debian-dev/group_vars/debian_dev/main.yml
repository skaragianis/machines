---
debian_dev_user: dev

# Public keys allowed to log in as dev. This list is the single source of
# truth: it is installed with exclusive: true, so a key that isn't here is
# removed from the host on the next run. To grant a new machine access, add
# its public key below and re-run provision.yml from a machine that already
# has access (password auth is off, so a new machine can't grant itself).
dev_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC5CUHJESCu51g4NqYtk9GDrD6hsZ6lkGoOrR1yZTEUB steffan.karagianis@gmail.com" # MacOs
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKDzZzVX1Q13Gs8W+c8MOnxg70gTl8jF8rh7dtF2p7Yw steffan.karagianis@gmail.com" # Debian
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICeP2nqLtn8DDbpNqBR4uk5VD08LnCmZi0NW85ESn6p5 steffan.karagianis@gmail.com" # Ios

# Only slow-moving system packages stay on apt. Fast-moving developer tools
# (Go, Docker, fzf, lazygit, ripgrep, fd, zoxide, jq, hunk, delta, difftastic,
# herdr, pi, bun, floci, rtk, tuxedo, just) are installed
# directly from upstream so every run tracks the latest release. See
# github_release_tools
apt_packages:
  - build-essential
  - cmake
  - curl
  - fish
  - git
  - gnupg
  - htop
  - libclang-dev
  - libssl-dev
  - libtree-sitter-dev
  - nvme-cli
  - pkg-config
  - sqlite3
  - tmux
  - tree
  - unzip
  - wget
  - zip

pnpm_home: "/home/{{ debian_dev_user }}/.local/share/pnpm"
pnpm_bin: "{{ pnpm_home }}/bin"
fish_path: /usr/bin/fish
github_key_comment: debian-dev
node_version: "26"
dotfiles_repo: git@github.com:skaragianis/dotfiles.git

# Syncthing (tasks/syncthing.yml). Only syncthing_folder is synced to this box,
# and only with these peers; anything else found in its config is removed.
# It is the peers' whole Sync folder (ID "default"), but the ignore patterns
# (first match wins) mean only Todo is ever transferred.
# Device IDs are public identifiers, not secrets. Addresses are tailnet IPs.
syncthing_api: http://127.0.0.1:8384
syncthing_folder:
  id: default
  label: Default Folder
  path: "/home/{{ debian_dev_user }}/Sync"
  type: sendreceive
  ignores:
    - "!/Todo"
    - "*"
syncthing_peers:
  - name: air
    id: YEX2Y6R-JWFU46R-ZYUWTB3-5UJKRSF-5IXH647-KBVP5CM-LKVQEDE-URWOQAH
    address: tcp://100.118.124.127:22000
  - name: thinkpad
    id: VFFJV6G-DIKPTHT-UEKY33M-W42R4BC-DTA4QS7-EKXE2R6-KNDRNOL-FI2Y5QY
    address: tcp://100.93.52.110:22000
  - name: phone
    id: RIMLLBT-KUOSUYG-D2ZW2IK-PJ2TAGZ-4UZN6IO-IGG2VUR-IRIWRPG-77NJAQ2
    address: tcp://100.88.153.40:22000

# Version commands for the end-of-run summary (tasks/summary.yml). `name` is the
# label, `cmd` is run through bash with dev's PATH and its first output line is
# shown.
summary_tools:
  - { name: go, cmd: go version }
  - { name: rustc, cmd: rustc --version }
  - { name: cargo, cmd: cargo --version }
  - { name: rust-analyzer, cmd: rust-analyzer --version }
  - { name: node, cmd: node --version }
  - { name: pnpm, cmd: pnpm --version }
  - { name: bun, cmd: bun --version }
  - { name: uv, cmd: uv --version }
  - { name: ruff, cmd: ruff --version }
  - { name: ty, cmd: ty --version }
  - { name: yamllint, cmd: yamllint --version }
  - { name: docker, cmd: docker --version }
  - { name: gh, cmd: gh --version }
  - { name: psql, cmd: psql --version }
  - { name: tailscale, cmd: tailscale version }
  - { name: syncthing, cmd: syncthing --version }
  - { name: task, cmd: task --version }
  - { name: just, cmd: just --version }
  - { name: opentofu, cmd: tofu version }
  - { name: render, cmd: render --version }
  - { name: neovim, cmd: nvim --version }
  - { name: yazi, cmd: yazi --version }
  - { name: fzf, cmd: fzf --version }
  - { name: lazygit, cmd: lazygit --version }
  - { name: ripgrep, cmd: rg --version }
  - { name: fd, cmd: fd --version }
  - { name: zoxide, cmd: zoxide --version }
  - { name: jq, cmd: jq --version }
  - { name: hunk, cmd: hunk --version }
  - { name: delta, cmd: delta --version }
  - { name: difftastic, cmd: difft --version }
  - { name: herdr, cmd: herdr --version }
  - { name: floci, cmd: floci --version }
  - { name: rtk, cmd: rtk --version }
  - { name: pi, cmd: pi --version }
  - { name: claude, cmd: claude --version }
  - { name: codex, cmd: codex --version }
  - { name: playwright, cmd: playwright --version }
  - { name: prettier, cmd: prettier --version }
  - { name: typescript, cmd: tsc --version }
  - { name: fish, cmd: fish --version }
  - { name: tmux, cmd: tmux -V }
  - { name: tuxedo, cmd: tuxedo --version }
